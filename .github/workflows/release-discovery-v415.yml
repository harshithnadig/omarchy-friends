name: Release Discovery v4.15

on:
  push:
    branches: [feature/build-network]
    paths:
      - .github/workflows/release-discovery-v415.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded release-discovery patch
        run: python3 scripts/release-discovery-v415.py
      - name: Verify engine compiles and suite remains green
        run: |
          python3 -m py_compile bin/omarchy-friends
          python3 -m unittest discover -s tests -v
          bash scripts/release-gate.sh --ci
      - name: Commit engine update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "harshithnadig"
          git config user.email "67705498+harshithnadig@users.noreply.github.com"
          git add bin/omarchy-friends
          git commit -m "update: add bounded official release discovery"
          git push origin HEAD:feature/build-network
