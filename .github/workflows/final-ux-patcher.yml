name: One-shot final UX patcher

# Temporary migration runner. Delete after the patch lands.
on:
  push:
    branches:
      - feature/build-network
    paths:
      - '.github/workflows/final-ux-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
      - name: Apply final UX patch
        run: python3 scripts/_final_ux_patch.py
      - name: Validate patch
        run: |
          git diff --check
          python3 -m unittest tests.test_runtime_contract tests.test_ui_contract -v
      - name: Commit patch
        run: |
          git config user.name "omarchy-friends-migration"
          git config user.email "67705498+harshithnadig@users.noreply.github.com"
          git add BarWidget.qml FriendsPanelV3.qml BuildNetworkPanelV3.qml
          git commit -m "fix: make Build chat handoff and shared links actionable"
          git push origin HEAD:feature/build-network
