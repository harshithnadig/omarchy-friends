name: One-shot group visibility fixer

on:
  push:
    branches:
      - feature/build-network
    paths:
      - '.github/workflows/group-visibility-fixer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
      - name: Keep empty private groups visible
        run: python3 scripts/_group_visibility_fix.py
      - name: Validate
        run: |
          git diff --check
          python3 -m unittest tests.test_final_ux_contract tests.test_ui_contract -v
      - name: Commit fix and remove migration helpers
        run: |
          git config user.name "omarchy-friends-migration"
          git config user.email "67705498+harshithnadig@users.noreply.github.com"
          git add FriendsPanelV3.qml
          git rm .github/workflows/group-visibility-fixer.yml scripts/_group_visibility_fix.py
          git commit -m "fix: keep new private groups visible before first message"
          git push origin HEAD:feature/build-network
