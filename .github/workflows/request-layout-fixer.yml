name: One-shot sent request layout fixer

# Temporary self-removing migration runner.
on:
  push:
    branches:
      - feature/build-network
    paths:
      - '.github/workflows/request-layout-fixer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
      - name: Apply request layout fix
        run: python3 scripts/_request_layout_fix.py
      - name: Validate
        run: |
          git diff --check
          python3 -m unittest tests.test_final_ux_contract tests.test_ui_contract -v
      - name: Commit fix and remove migration helpers
        run: |
          git config user.name "omarchy-friends-migration"
          git config user.email "67705498+harshithnadig@users.noreply.github.com"
          git add FriendsPanelV3.qml
          git rm .github/workflows/request-layout-fixer.yml scripts/_request_layout_fix.py
          git commit -m "fix: keep sent request actions inside card"
          git push origin HEAD:feature/build-network
