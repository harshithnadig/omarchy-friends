name: Finalize private interoperability

on:
  push:
    branches:
      - feature/build-network
    paths:
      - 'scripts/finalize-private-interop.py'
      - 'scripts/finalize-private-interop-v2.py'
      - '.github/workflows/finalize-private-interop.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply NIP-17 inbox interoperability hardening
        run: |
          python scripts/finalize-private-interop-v2.py
          git diff --check
      - name: Compile active messaging modules
        run: |
          python -m py_compile \
            bin/omarchy_friends_global.py \
            bin/omarchy_friends_private.py \
            bin/omarchy-friends
      - name: Run private messaging standards and engine tests
        run: python -m unittest tests.test_private_messaging tests.test_private_messaging_engine -v
      - name: Run two-user journey
        run: python -m unittest tests.test_e2e_journey -v
      - name: Run complete repository unit suite
        run: python -m unittest discover -s tests -v
      - name: Run static release gate
        run: bash scripts/release-gate.sh --ci
      - name: Commit hardened source and tests
        run: |
          if git diff --quiet; then
            echo 'Interop hardening already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/omarchy-friends bin/omarchy_friends_private.py tests/test_private_messaging.py tests/test_private_messaging_engine.py tests/test_e2e_journey.py
          git commit -m 'fix: route NIP-17 messages through verified inbox relays'
          git push origin HEAD:feature/build-network
