name: Finalize v4.14 RC

on:
  push:
    branches:
      - feature/build-network
    paths:
      - 'scripts/finalize-v414.py'
      - 'scripts/finalize-v414-post.py'
      - '.github/workflows/finalize-v414.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply anchor-checked final UI/release patch
        run: |
          python scripts/finalize-v414.py
          python scripts/finalize-v414-post.py
          git diff --check
      - name: Compile active Python modules
        run: |
          python -m py_compile \
            bin/build_network.py \
            bin/build_network_social.py \
            bin/build_network_v2.py \
            bin/build_network_v3.py \
            bin/build_network_runtime.py \
            bin/build_network_app_v2.py \
            bin/build_network_app_v3.py \
            bin/build_network_app_v4.py \
            bin/omarchy-friends-open
      - name: Run complete unit suite on finalized tree
        run: python -m unittest discover -s tests -v
      - name: Enforce Build Network remote-exec boundary
        run: |
          ! grep -R -nE 'eval\(|exec\(|os\.system\(|shell=True' \
            bin/build_network*.py bin/omarchy-friends-open
      - name: Confirm release version consistency
        run: |
          python - <<'PY'
          import json, re
          manifest = json.load(open('manifest.json', encoding='utf-8'))['version']
          text = open('bin/omarchy-friends', encoding='utf-8').read()
          match = re.search(r'^PLUGIN_VERSION\s*=\s*"([^"]+)"', text, re.M)
          assert match and match.group(1) == manifest, (match.group(1) if match else None, manifest)
          print('version', manifest)
          PY
      - name: Commit finalized source if needed
        run: |
          if git diff --quiet; then
            echo 'Finalizer already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bin/omarchy-friends \
            bin/build_network_app_v3.py \
            bin/build_network_app_v4.py \
            Panel.qml \
            BuildNetworkPanelV3.qml \
            tests/test_release_hardening.py
          git commit -m 'feat: finalize v4.14 UI reachability and release guards'
          git push origin HEAD:feature/build-network
