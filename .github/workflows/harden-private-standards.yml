name: Harden private messaging standards

on:
  push:
    branches:
      - feature/build-network
    paths:
      - 'scripts/harden-private-standards.py'
      - '.github/workflows/harden-private-standards.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact NIP-44 limits and sticky upgrade
        run: |
          python scripts/harden-private-standards.py
          git diff --check
      - name: Compile active Friends and Build modules
        run: |
          python -m py_compile \
            bin/omarchy_friends_global.py \
            bin/omarchy_friends_private.py \
            bin/omarchy-friends \
            bin/build_network_app_v4.py
      - name: Run private messaging standards and engine tests
        run: python -m unittest tests.test_private_messaging tests.test_private_messaging_engine -v
      - name: Run complete repository unit suite
        run: python -m unittest discover -s tests -v
      - name: Run static release gate
        run: bash scripts/release-gate.sh --ci
      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo 'Hardening already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bin/omarchy_friends_private.py \
            bin/omarchy-friends \
            tests/test_private_messaging.py \
            tests/test_private_messaging_engine.py
          git commit -m 'fix: enforce exact NIP-44 v2 limits and sticky upgrade'
          git push origin HEAD:feature/build-network
