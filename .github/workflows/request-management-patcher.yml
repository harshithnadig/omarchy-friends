name: One-shot request management patcher

on:
  push:
    branches:
      - feature/build-network
    paths:
      - '.github/workflows/request-management-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-network
      - name: Apply request lifecycle patch
        run: python3 scripts/_request_patch.py
      - name: Validate patch
        run: |
          python3 -m py_compile bin/omarchy-friends
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "omarchy-friends-migration"
          git config user.email "67705498+harshithnadig@users.noreply.github.com"
          git add bin/omarchy-friends FriendsPanelV3.qml
          git commit -m "feat: add decline and cancel friend requests"
          git push origin HEAD:feature/build-network
